[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ast = true
build_info = true
extra_output = ["storageLayout"]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
